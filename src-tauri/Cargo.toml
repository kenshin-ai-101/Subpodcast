[package]
name = "subpodcast"
version = "1.1.0"
description = "Subpodcast · 声译 — bilingual podcast & YouTube listener"
authors = ["Subpodcast"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "subpodcast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "gzip", "brotli", "system-proxy", "multipart", "stream"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
roxmltree = "0.20"
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
anyhow = "1"
once_cell = "1"
urlencoding = "2"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
futures-util = "0.3"
tiny_http = "0.12"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "wav", "flac", "ogg", "vorbis", "pcm"] }
flate2 = "1"
tar = "0.4"
bzip2 = "0.6"
tempfile = "3"
tokio-socks = "0.5"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
arboard = "3"
rusty-chromaprint = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.14", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.14"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
